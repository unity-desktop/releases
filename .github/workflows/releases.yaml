---
name: unity-desktop releases flow

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Ubuntu series to publish
        type: choice
        options: [stonking]
        default: stonking

permissions:
  contents: read

concurrency:
  group: apt-${{ inputs.suite }}

env:
  SUITE: ${{ inputs.suite }}

jobs:
  check:
    name: Check ${{ inputs.suite }}
    runs-on: ubuntu-latest
    outputs:
      uploads: ${{ steps.check.outputs.uploads }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check the uploads
        id: check
        run: uv run --locked --no-dev releases check "$SUITE"

  publish:
    name: Publish ${{ inputs.suite }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      RELEASES_USERNAME: ${{ github.actor }}
      RELEASES_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install aptly
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aptly

      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Pull the digests that the check pinned, not the tags again.
      - name: Pull the uploads
        env:
          UPLOADS: ${{ needs.check.outputs.uploads }}
        run: uv run --locked --no-dev releases pull "$UPLOADS" "$RUNNER_TEMP/uploads"

      - name: Assemble and sign the repository
        env:
          GPG_KEY: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          aptly repo create -distribution="$SUITE" -component=main unity
          aptly repo add unity "$RUNNER_TEMP/uploads"
          aptly publish repo -batch -architectures=amd64,source \
            -gpg-key="$GPG_KEY" -passphrase="$GPG_PASSPHRASE" unity

      - name: Push the repository
        run: |
          uv run --locked --no-dev releases push "$SUITE" "$HOME/.aptly/public" \
            --tag "$SUITE-$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
